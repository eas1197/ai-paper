name: Fresh qualitative topic with persistent checkpoints

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/persistent-topic-20261122
    paths:
      - .github/workflows/persistent-qualitative-topic.yml
      - .github/scripts/cloud_research.py
      - .github/tests/test_cloud_research.py
      - .github/research_inputs/bike_fresh_reality_20261122.json
      - .github/research_inputs/bike_fresh_events_20261122.json

permissions:
  contents: write

concurrency:
  group: cloud-topic-bike-fresh-20261122
  cancel-in-progress: false

jobs:
  fresh-topic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_ID: bike_fresh_20261122
      RESEARCH_THEME: 城市共享单车停放与数字平台治理
      STATE_BRANCH: research-state/topic-20261122
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run cloud persistence regression tests
        run: python -B -m unittest discover -s .github/tests -p test_cloud_research.py -v

      - name: Install declared research tool import requirements
        run: python -m pip install -r "11_文献采集适配/v003_第3版/requirements.txt"

      - name: Load durable research-state branch
        shell: bash
        run: |
          git fetch origin "refs/heads/$STATE_BRANCH:refs/remotes/origin/$STATE_BRANCH"
          git worktree add --detach "$RUNNER_TEMP/research_state" "refs/remotes/origin/$STATE_BRANCH"
          python -B .github/scripts/cloud_research.py restore \
            --run-id "$RUN_ID" --store "$RUNNER_TEMP/research_state"

      - name: Run actual v3.2 topic initialization, reality, and event comparison
        shell: bash
        run: |
          set -o pipefail
          python -B .github/scripts/cloud_research.py run \
            --run-id "$RUN_ID" \
            --theme "$RESEARCH_THEME" \
            --reality .github/research_inputs/bike_fresh_reality_20261122.json \
            --events .github/research_inputs/bike_fresh_events_20261122.json \
            | tee "$RUNNER_TEMP/topic_execution_report.json"

      - name: Persist public evidence metadata and stage checkpoint to dedicated branch
        shell: bash
        run: |
          python -B .github/scripts/cloud_research.py store \
            --run-id "$RUN_ID" --store "$RUNNER_TEMP/research_state"
          git -C "$RUNNER_TEMP/research_state" config user.name "ai-paper-actions[bot]"
          git -C "$RUNNER_TEMP/research_state" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/research_state" add -- "cloud_runs/$RUN_ID"
          if ! git -C "$RUNNER_TEMP/research_state" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/research_state" commit -m "checkpoint: $RUN_ID next-stage source records and hashes"
            git -C "$RUNNER_TEMP/research_state" push origin "HEAD:refs/heads/$STATE_BRANCH"
          else
            echo "Checkpoint unchanged and already durable."
          fi

      - name: Confirm new research state and evidence provenance
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          run_id=os.environ["RUN_ID"]
          base=Path("00_项目控制/v007_第7版/runs_dev")/run_id
          stage=json.loads((base/"staged_topic.json").read_text(encoding="utf-8"))
          manifest=json.loads((base/"run_manifest.json").read_text(encoding="utf-8"))
          comparison=json.loads((base/"event_comparison.json").read_text(encoding="utf-8"))
          assert stage["status"]=="explanation_exchange"
          assert stage["mode"]=="dev" and stage["reality_first"]
          assert comparison["event_count"]>=2
          assert manifest["formal_eligible"] is False
          assert not (base/"s08_topic.json").exists()
          assert not (base/"writing/论文写作方案.md").exists()
          print("REAL TOPIC INIT / REALITY / EVENT COMPARISON SUCCESS")
          print("Academic gates preserved; no independent critic or research freeze yet.")
          PY

      - name: Save audit summary as short-lived downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-topic-audit-20261122
          path: |
            00_项目控制/v007_第7版/runs_dev/bike_fresh_20261122/cloud_run_status.json
            00_项目控制/v007_第7版/runs_dev/bike_fresh_20261122/cloud_next_task.json
            00_项目控制/v007_第7版/runs_dev/bike_fresh_20261122/run_manifest.json
            00_项目控制/v007_第7版/runs_dev/bike_fresh_20261122/staged_topic.json
            00_项目控制/v007_第7版/runs_dev/bike_fresh_20261122/event_comparison.json
          if-no-files-found: warn
          retention-days: 20
